[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = Never
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   interfaces = 127.0.0.1 192.168.100.0/24
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.100.0/24
   hosts deny = ALL
   load printers = no
   disable spoolss = yes

[Files]
   path = /srv/nas
   browseable = yes
   read only = no
   guest ok = no
   valid users = nas
   force user = nas
   create mask = 0600
   directory mask = 0700
